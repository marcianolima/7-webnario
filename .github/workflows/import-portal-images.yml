name: Import official GeoCanoas portal images
on:
  push:
    paths:
      - "assets/data/portal-image-sources.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Download and verify official images
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error, time, io
          from PIL import Image, ImageOps
          manifest = pathlib.Path("assets/data/portal-image-sources.json")
          items = json.loads(manifest.read_text(encoding="utf-8"))
          target_dir = pathlib.Path("assets/images/portal")
          target_dir.mkdir(parents=True, exist_ok=True)
          report = []
          for obj in items:
              name = obj["name"]
              source = obj["url"]
              if not source.startswith("https://sistemas.canoas.rs.gov.br/geo/portal/assets/img/"):
                  raise ValueError("Only verified GeoCanoas portal image origins allowed")
              target = target_dir / (name + ".webp")
              ok = False
              message = ""
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(source, headers={
                          "User-Agent": "Mozilla/5.0 (GeoCanoas-Webinar-Asset-Archiver/1.0)",
                          "Accept": "image/avif,image/webp,image/png,image/jpeg,image/*;q=0.8",
                          "Referer": "https://sistemas.canoas.rs.gov.br/geo/portal/"
                      })
                      with urllib.request.urlopen(req, timeout=24) as response:
                          raw = response.read(12 * 1024 * 1024 + 1)
                          ctype = response.headers.get("Content-Type", "")
                          status = response.status
                      if len(raw) > 12 * 1024 * 1024:
                          raise ValueError("Image exceeds 12 MB")
                      with Image.open(io.BytesIO(raw)) as im:
                          im.load()
                          img = ImageOps.exif_transpose(im).convert("RGB")
                          if img.width < 150 or img.height < 90:
                              raise ValueError(f"Image dimensions too small: {img.size}")
                          img.save(target, "WEBP", quality=88, method=6)
                          message = f"HTTP {status}, {ctype}, {img.width}x{img.height}, {target.stat().st_size} bytes"
                      ok = True
                      break
                  except Exception as exc:
                      message = str(exc)[:300]
                      if attempt < 2:
                          time.sleep(2*(attempt+1))
              report.append(dict(name=name, status="downloaded" if ok else "unavailable", file=str(target) if ok else None, source=source, details=message))
              print(("OK  " if ok else "FAIL"), name, message)
          pathlib.Path("assets/data/portal-image-download-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Successful downloads:", sum(x["status"] == "downloaded" for x in report), "of", len(report))
          PY
      - name: Commit accessible assets and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images/portal assets/data/portal-image-download-report.json
          git diff --cached --quiet && exit 0
          git commit -m "assets: store verified local copies of GeoCanoas portal images"
          git push
